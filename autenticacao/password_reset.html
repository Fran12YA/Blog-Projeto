<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar Senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow border-0 p-4 rounded">
                    <h3 class="fw-bold text-primary mb-3">Recuperar Senha</h3>
                    <p class="text-secondary small mb-4">Insira o endereço de e-mail associado à sua conta e enviaremos um link para redefinir sua senha.</p>
                    
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_email" class="form-label fw-semibold">E-mail cadastrado</label>
                            <input type="email" name="email" class="form-control" id="id_email" placeholder="seuemail@exemplo.com" required>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary fw-bold">Enviar Link de Recuperação</button>
                            <a href="{% url 'login' %}" class="btn btn-link text-decoration-none text-secondary btn-sm">Voltar para o Login</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
