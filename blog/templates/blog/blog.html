<!doctype html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello, world!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
            rel="stylesheet" 
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
            crossorigin="anonymous">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container-fluid bg-dark mb-2">
        <div class="row justify-content-center">
            <div class="col-xl-8">
                <header class="bg-dark mb-2">        
                    {% include 'fragments/navbar.html' %}
                                        {% include 'fragments/carousel.html' %}

                </header>
            </div> 
        </div> 
    </div> 

    <main class="bg-light py-4"> 
        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-xl-7"> 
                    
                    {% for post in posts %}
                    <div class="card mx-5 px-5 py-2">

    <a href="{% url 'post_detail' posts.0.id %}"> 
        <img src="{{ posts.0.image_capa.url }}" 
    class="card-img-top" 
    alt="Imagem do card">
    </a>

<div class="card-body pb-4">
    
    <a href="{% url 'post_detail' post.id %}">
        <h4 class="card-title">
        
            {{post.titulo}}</h4>
        </a>

    <p class="card-text"> 
        {{ post.resumo|safe}} 
    </p>
    <p class="card-text">
<small class="text-muted d-flex justify-content-end">{{ post.data_publicacao}}</small>
      
    </p>
    <div class="row">
        <div class="col-12">
        <div class="d-flex justify-content-center">
            <div class="span me-3 btn">
            <i class="fa-solid fa-thumbs-up"></i> 
            </div>
            <div class="span me-3 btn">
            <i class="fa-regular fa-comments"></i> 
            </div>
            <div class="span me-3 btn">
            <i class="fa-solid fa-share-from-square"></i> 
            </div>
        </div>
        </div>
    </div>


      </div>
                  
    </div>
    <div class="my-3"></div>
                    {% endfor %}
                    </div>  
            </div>  
        </div>
    </main>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
            crossorigin="anonymous"></script>
</body>
</html>
