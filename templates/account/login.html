<!doctype html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Academia das Galáxias - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <div class="container-fluid bg-dark mb-4">
        <div class="row justify-content-center">
            <div class="col-xl-8">
                <header class="bg-dark">        
                    {% include 'fragments/navbar.html' %}
                </header>
            </div> 
        </div> 
    </div> 

<main class="flex-grow-1">
    <div class="container-fluid py-5">
        <div class="row justify-content-center">
            <div class="col-xl-8"> 
                <div class="row justify-content-center">
                    
                    <div class="col-md-6">
                        
                        <div class="bg-light p-4 p-sm-5 rounded border shadow-sm">
                            
                            <div class="mb-4 text-center text-sm-start">
                                <span class="fw-bold fs-2 text-primary">Login</span>
                            </div>

                            {% if messages %}
                                {% for message in messages %}
                                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} text-center small" role="alert">
                                        {{ message }}
                                    </div>
                                {% endfor %}
                            {% endif %}
                            
                            <form method="POST" action="{% url 'account_login' %}">
                                {% csrf_token %}
                                
                                <div class="mb-3">
                                    <label for="idEmailLogin" class="form-label">Usuário ou email</label>
                                    <input type="text" class="form-control" id="idEmailLogin" name="login" placeholder="Digite aqui seu usuário ou email" required>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="idSenhaLogin" class="form-label">Senha</label>
                                    <input type="password" class="form-control" id="idSenhaLogin" name="password" placeholder="Digite aqui sua senha" required>
                                </div>
                                
                                <div class="d-flex justify-content-between align-items-center mb-4 small">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" id="exampleCheck1" name="remember">
                                        <label class="form-check-label" for="exampleCheck1">Lembrar de mim</label>
                                    </div>
                                    <a href="{% url 'account_reset_password' %}" class="text-success fw-bold text-decoration-none">Esqueceu sua senha?</a>                        
                                </div>
                                
                                <div class="d-grid mb-3">
                                    <button type="submit" class="btn btn-secondary fw-semibold">Logar</button>
                                </div>

                                <div class="d-grid mb-2"> 
                                    <button class="btn btn-primary" type="button">
                                        <i class="fa-brands fa-facebook me-2"></i> Entrar com Facebook
                                    </button>
                                </div>

                                <div class="d-grid mb-2"> 
                                    <button class="btn btn-danger" type="button"> 
                                        <i class="fa-brands fa-google me-2"></i> Entrar com Google
                                    </button>
                                </div>

                                <div class="d-grid mb-4"> 
                                    <button class="btn btn-dark" type="button"> 
                                        <i class="fa-brands fa-x-twitter me-2"></i> Entrar com X
                                    </button>
                                </div>

                                <div class="text-center mt-3"> 
                                    <a href="{% url 'account_signup' %}" class="text-secondary fw-bold text-decoration-none small">Criar conta</a>
                                </div>
                            </form>

                        </div>
