<!doctype html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Academia das Galáxias - Sair</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <div class="container-fluid bg-dark mb-4">
        <div class="row justify-content-center">
            <div class="col-xl-8">
                <header class="bg-dark">        
                    {% include 'fragments/navbar.html' %}
                </header>
            </div> 
        </div> 
    </div> 

<main class="flex-grow-1 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5"> 
                <div class="bg-light p-4 p-sm-5 rounded border shadow-sm text-center">
                    
                    <div class="mb-4">
                        <i class="bi bi-box-arrow-left text-danger" style="font-size: 3rem;"></i>
                        <h2 class="fw-bold text-dark mt-2">Deseja realmente sair?</h2>
                        <p class="text-muted small">Você está conectado como <strong class="text-primary">{{ user.username }}</strong>.</p>
                    </div>

                    <form method="POST" action="{% url 'account_logout' %}">
                        {% csrf_token %}
                        
                        <div class="d-flex gap-3 justify-content-center">
                            <button type="submit" class="btn btn-danger px-4 fw-semibold">Sim</button>
                            <a href="{% url 'home' %}" class="btn btn-secondary px-4 fw-semibold">Não</a>
                        </div>
                    </form>

                </div> 
            </div>  
        </div>  
    </div>
</main>

    {% include 'fragments/footer.html' with var_position="position-sticky" %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
